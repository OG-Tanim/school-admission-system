# School Admission System — one-command stack.
#
#   docker compose up --build
#     frontend: http://localhost:3000
#     backend:  http://localhost:8080
#
# PostgreSQL data lives in the named volume `postgres_data`, so it survives
# `docker compose down` followed by `docker compose up`. Only
# `docker compose down -v` deletes the volume (and the data with it).
#
# Optional overrides can be supplied in a root `.env` file (git-ignored).

name: school-admission

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The database connection is configurable through this environment variable.
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Apply EF Core migrations on startup (waits for PostgreSQL to accept connections).
      Database__MigrateOnStartup: "true"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: "80"
      # Every frontend start reads the backend URL from this file. The UI's
      # per-user override lives in the browser and never reaches it.
      CONFIG_FILE: /config/api-url.env
      API_URL: ${API_URL:-http://localhost:8080}
    volumes:
      # Read-only: the environment file is the startup source of truth, so the
      # container cannot rewrite it.
      - ./config:/config:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
